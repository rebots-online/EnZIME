name: EnZIME local engine
on:
  push:
    paths: ['consolidated/**', '.github/workflows/local-engine.yml']
  pull_request:
    paths: ['consolidated/**', '.github/workflows/local-engine.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consolidated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: consolidated/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
