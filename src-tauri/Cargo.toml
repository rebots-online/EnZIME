[package]
name = "enzime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "enzime"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "enzime"
path = "src/main.rs"

[features]
default = ["desktop"]
# Play Store flavor: fetcher = Play Billing integration
play = []
# Sideload flavor: fetcher = direct HTTP download from mirror
sideload = []
# Desktop flavor: fetcher = local filesystem + optional mirror download
desktop = []

[dependencies]
dirs = "5.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
sha2 = "0.10"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
ciborium = "0.2"
rusqlite = { version = "0.31", features = ["bundled", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
futures-util = "0.3"
tracing-appender = "0.2"
mdns-sd = "0.11"
anzimmermanlib = { path = "anzimmermanlib/rust" }
tauri = { workspace = true, features = [] }
ndk-context = "0.1"
jni = "0.21"

[build-dependencies]
tauri-build = { version = "2", features = [] }
